<!doctype html>
<html>
  <body>
    <h1>Chat test</h1>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

    <script>
      const socket = io('http://localhost:3000');

      socket.on('connect', () => {
        console.log('Connected:', socket.id);
      });

      socket.on('disconnect', () => {
        console.log('Disconnected');
      });
    </script>
  </body>
</html>
